name: syncloud

on:
  push:
    tags:
      - '*-syncloud.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./pkg/config -count=1
      - run: go test ./pkg/service -count=1 -run 'TURN|Turn'
      - run: go build -o livekit-${{ matrix.arch }} ./cmd/server
        env:
          CGO_ENABLED: '0'
      - run: ./livekit-${{ matrix.arch }} --version
      - uses: softprops/action-gh-release@v2
        with:
          files: livekit-${{ matrix.arch }}
